<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LazyGym</title>
<meta name="description" content="LazyGym: giáo án gym tự tăng tạ, tự bù khi bạn hụt mục tiêu, calo theo ngày tập và ngày nghỉ.">
<meta name="theme-color" content="#0E1116">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LazyGym">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one-column phone app shell (max 480px), sticky header, fixed 5-tab bar; IWF plate colours carry progress */
:root{
  --bg:#0E1116; --surface:#161A21; --surface2:#1E232C; --line:#2A303B; --fg:#ECEFF4; --muted:#8B94A5;
  --accent:#4B83FF; --accent-ink:#FFFFFF; --accent-soft:rgba(75,131,255,.16);
  --red:#EB4D4B; --yellow:#F0B43A; --green:#33C27A; --plate5:#E6E9EE;
  --good:#33C27A; --warn:#F0B43A; --bad:#EB4D4B;
  --scrim:rgba(4,6,10,.62); --shadow:0 14px 40px rgba(0,0,0,.45);
  --invert-bg:#ECEFF4; --invert-fg:#0E1116;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#F1F3F7; --surface:#FFFFFF; --surface2:#E8ECF2; --line:#DAE0E8; --fg:#10151D; --muted:#5A6373;
  --accent:#2C62E6; --accent-ink:#FFFFFF; --accent-soft:rgba(44,98,230,.11);
  --red:#D63A37; --yellow:#C68A0C; --green:#1C9A58; --plate5:#B9C1CC;
  --good:#1C9A58; --warn:#B87D06; --bad:#D63A37;
  --scrim:rgba(16,21,29,.42); --shadow:0 12px 32px rgba(20,32,56,.14);
  --invert-bg:#10151D; --invert-fg:#FFFFFF; color-scheme:light;}}
:root[data-theme="light"]{
  --bg:#F1F3F7; --surface:#FFFFFF; --surface2:#E8ECF2; --line:#DAE0E8; --fg:#10151D; --muted:#5A6373;
  --accent:#2C62E6; --accent-ink:#FFFFFF; --accent-soft:rgba(44,98,230,.11);
  --red:#D63A37; --yellow:#C68A0C; --green:#1C9A58; --plate5:#B9C1CC;
  --good:#1C9A58; --warn:#B87D06; --bad:#D63A37;
  --scrim:rgba(16,21,29,.42); --shadow:0 12px 32px rgba(20,32,56,.14);
  --invert-bg:#10151D; --invert-fg:#FFFFFF; color-scheme:light;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.app{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(104px + env(safe-area-inset-bottom,0px))}
.num,.d{font-family:var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.01em;text-transform:uppercase}
h3{font-size:16px;font-weight:700}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding-block:12px 10px}
.brand{display:flex;align-items:center;gap:9px}
.brand-mark{width:30px;height:30px;border-radius:9px;background:var(--fg);display:grid;place-items:center}
.brand-mark svg{width:20px;height:20px}
.brand b{font-family:var(--f-display);font-size:22px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.avatar{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;font-size:13px;font-weight:700}
.avatar i{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-style:normal;font-family:var(--f-display);font-size:16px}
.sync{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok{background:var(--good)} .sync.err{background:var(--bad)}

/* cards */
.card{background:var(--surface);border-radius:20px;padding:16px;border:1px solid var(--line)}
.card.flat{background:transparent;border:1px dashed var(--line)}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.link{color:var(--accent);font-weight:700;font-size:13.5px}

/* hero */
.hero{position:relative;overflow:hidden;padding:18px 16px 14px}
.hero-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.pct{font-family:var(--f-display);font-weight:700;font-size:64px;line-height:.9;letter-spacing:-.01em}
.pct small{font-size:26px;color:var(--muted);margin-left:2px}
.bar-svg{width:100%;height:auto;display:block;margin:6px 0 4px}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.metric{background:var(--surface2);border-radius:14px;padding:10px 10px 9px;min-width:0}
.metric .v{font-family:var(--f-display);font-size:22px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.metric .v span{font-size:14px;color:var(--muted);font-weight:600}
.metric .l{font-size:11.5px;color:var(--muted);margin-top:4px;font-weight:600}
.meter{height:4px;border-radius:4px;background:var(--line);margin-top:8px;overflow:hidden}
.meter>b{display:block;height:100%;border-radius:4px;background:var(--accent)}

/* coach */
.coach{display:flex;flex-direction:column;gap:10px}
.note{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;font-size:14px}
.note .ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:15px}
.ic.up{background:rgba(51,194,122,.15);color:var(--good)}
.ic.carry{background:rgba(240,180,58,.17);color:var(--warn)}
.ic.down{background:rgba(235,77,75,.14);color:var(--bad)}
.ic.info{background:var(--accent-soft);color:var(--accent)}

/* pills, chips */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.good{background:rgba(51,194,122,.15);color:var(--good)}
.pill.warn{background:rgba(240,180,58,.17);color:var(--warn)}
.pill.bad{background:rgba(235,77,75,.14);color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 14px;border-radius:12px;background:var(--surface2);border:1.5px solid transparent;font-weight:600;font-size:14px}
.chip.on{background:var(--accent-soft);border-color:var(--accent)}
.chip small{display:block;font-size:11.5px;color:var(--muted);font-weight:500;margin-top:1px}
.chip.day{min-width:0;text-align:center;padding:10px 0;flex:1}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface2);border-radius:12px;padding:3px;gap:3px}
.seg button{padding:8px 4px;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.15)}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border-radius:15px;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:.06em;text-transform:uppercase}
.btn.ghost{background:var(--surface2);color:var(--fg)}
.btn.sm{min-height:42px;font-size:17px;border-radius:12px}
.btn.danger{background:rgba(235,77,75,.14);color:var(--bad)}
.btn:active{transform:scale(.985)}
.mini{padding:7px 11px;border-radius:10px;background:var(--surface2);font-weight:700;font-size:13px}
.mini.acc{background:var(--accent);color:var(--accent-ink)}

/* workout preview list */
.exlist{display:flex;flex-direction:column}
.exrow{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.exrow:first-child{border-top:0}
.exrow .n{font-family:var(--f-display);font-size:16px;color:var(--muted);font-weight:600}
.exrow .t{font-weight:700;font-size:14.5px;line-height:1.25}
.exrow .s{font-size:12.5px;color:var(--muted)}
.exrow .w{font-family:var(--f-display);font-size:20px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.exrow .w small{font-size:12px;color:var(--muted)}
.tag-up{color:var(--good);font-size:12px;font-weight:800}

/* habits */
.habit{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.habit:first-of-type{border-top:0;padding-top:2px}
.habit .hv{font-family:var(--f-display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.habit .hv span{font-size:15px;color:var(--muted)}
.habit .meter{grid-column:1/-1;margin-top:0}
.cups{display:flex;gap:5px;grid-column:1/-1;flex-wrap:wrap}
.cup{width:26px;height:32px;border-radius:5px 5px 9px 9px;border:1.5px solid var(--line);position:relative;overflow:hidden}
.cup.on{border-color:var(--accent);background:var(--accent-soft)}
.cup.on::after{content:"";position:absolute;inset:auto 0 0;height:70%;background:var(--accent);opacity:.75}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:11px;font-weight:700;color:var(--muted)}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--accent)}

/* workout */
.wk-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:10px 10px;display:flex;flex-direction:column;gap:9px}
.wk-bar{height:6px;border-radius:6px;background:var(--surface2);overflow:hidden}
.wk-bar b{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--green));border-radius:6px;transition:width .3s}
.excard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px 12px 10px}
.excard.done{border-color:color-mix(in srgb,var(--green) 45%,var(--line))}
.exhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:0 4px 8px}
.exhead h3{font-size:17px}
.setgrid{display:grid;grid-template-columns:26px minmax(0,1.25fr) minmax(0,1fr) 46px;gap:7px;align-items:center}
.sethead{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:2px 0 4px;text-align:center}
.setrow{padding:4px 0;border-radius:12px}
.setrow .sn{font-family:var(--f-display);font-weight:700;font-size:17px;color:var(--muted);text-align:center}
.setrow.on .sn{color:var(--green)}
.step{display:flex;align-items:center;background:var(--surface2);border-radius:12px;height:46px;min-width:0}
.step button{width:30px;height:46px;font-size:20px;color:var(--muted);flex:none}
.step input{width:100%;min-width:0;text-align:center;background:transparent;border:0;font-family:var(--f-display);font-weight:700;font-size:21px;padding:0;font-variant-numeric:tabular-nums}
.step input:focus{outline:none}
.setrow.on .step{background:color-mix(in srgb,var(--green) 13%,var(--surface2))}
.check{width:46px;height:46px;border-radius:12px;border:2px solid var(--line);display:grid;place-items:center}
.check svg{width:22px;height:22px;opacity:.35}
.setrow.on .check{background:var(--green);border-color:var(--green);color:#fff}
.setrow.on .check svg,.check.on svg{opacity:1}
.check.on{background:var(--green);border-color:var(--green);color:#fff}
.prev{font-size:11.5px;color:var(--muted);grid-column:2/4;margin-top:-2px;padding-left:4px}
.plates{display:flex;gap:3px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.plates i{display:inline-block;width:7px;border-radius:2px}
.rest{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.rest-in{max-width:448px;margin:0 auto;background:var(--invert-bg);color:var(--invert-fg);border-radius:20px;padding:12px 12px 12px 18px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow);pointer-events:auto}
.rest-in .rt{font-family:var(--f-display);font-weight:700;font-size:38px;line-height:1;font-variant-numeric:tabular-nums;min-width:86px}
.rest-in .rl{font-size:12px;font-weight:700;opacity:.65;line-height:1.2}
.rest-in button{padding:10px 12px;border-radius:12px;font-weight:800;font-size:13px;background:color-mix(in srgb,var(--invert-fg) 12%,transparent)}
.rest-in.go{background:var(--green);color:#fff}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:var(--scrim)}
.sheet{width:100%;max-width:480px;max-height:90%;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .26s cubic-bezier(.2,.8,.2,1)}
.grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 12px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}.wk-bar b{transition:none}}

/* forms */
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lab{font-size:12.5px;font-weight:700;color:var(--muted)}
.inp{height:48px;border-radius:12px;background:var(--surface2);border:1.5px solid transparent;padding:0 14px;font-size:16px;width:100%;min-width:0}
.inp:focus{outline:none;border-color:var(--accent)}
select.inp{appearance:none;-webkit-appearance:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

/* calendar */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.wd{background:var(--surface2);border-radius:12px;padding:8px 2px 7px;text-align:center;min-width:0;border:1.5px solid transparent}
.wd .a{font-size:10.5px;font-weight:800;color:var(--muted);letter-spacing:.06em}
.wd .b{font-family:var(--f-display);font-size:19px;font-weight:700}
.wd .c{font-size:9.5px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
.wd.today{border-color:var(--accent)}
.wd.done{background:color-mix(in srgb,var(--green) 18%,var(--surface2))}
.wd.done .c{color:var(--good)}
.wd.miss .c{color:var(--bad)}
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mc{aspect-ratio:1;max-width:100%;border-radius:9px;display:grid;place-items:center;font-family:var(--f-display);font-weight:600;font-size:15px;background:var(--surface2);color:var(--muted);position:relative}
.mc.blank{background:transparent}
.mc.sched::after{content:"";position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;background:var(--muted)}
.mc.l1{background:color-mix(in srgb,var(--accent) 30%,var(--surface2));color:var(--fg)}
.mc.l2{background:color-mix(in srgb,var(--accent) 60%,var(--surface2));color:var(--fg)}
.mc.l3{background:var(--accent);color:var(--accent-ink)}
.mc.miss{box-shadow:inset 0 0 0 1.5px var(--bad)}
.mc.today{box-shadow:inset 0 0 0 2px var(--fg)}

/* kpis */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.kpi .v{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.kpi .v span{font-size:16px;color:var(--muted)}
.kpi .l{font-size:12px;color:var(--muted);font-weight:700;margin-top:6px}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--f-body);font-size:10px;fill:var(--muted)}

/* list */
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.li:first-child{border-top:0}
.li .ix{width:40px;height:40px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;flex:none;font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--muted)}
.li .ix.on{background:rgba(51,194,122,.15);color:var(--good)}
.li .tx{flex:1;min-width:0}
.li .tx b{display:block;font-size:14.5px;line-height:1.3}
.li .tx span{font-size:12.5px;color:var(--muted)}
.li .rt{font-family:var(--f-display);font-weight:700;font-size:18px;text-align:right;font-variant-numeric:tabular-nums}
.search{position:relative}
.lesson-body p{margin-bottom:10px;line-height:1.6}
.lesson-body li{margin-bottom:6px;line-height:1.5}
.bullets{margin:0;padding-left:18px}
.bullets li{margin-bottom:6px;line-height:1.5}

/* onboarding */
.ob-hero{padding-block:22px 6px}
.ob-hero h1{font-family:var(--f-display);font-weight:700;font-size:46px;line-height:.95;text-transform:uppercase;letter-spacing:.005em}
.ob-hero h1 em{font-style:normal;color:var(--accent)}
.preview{background:var(--invert-bg);color:var(--invert-fg);border-radius:20px;padding:16px}
.preview .eyebrow{color:inherit;opacity:.6}
.preview b.d{font-size:26px;display:block;margin-top:2px;text-transform:uppercase}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));z-index:60;background:var(--invert-bg);color:var(--invert-fg);padding:10px 16px;border-radius:999px;font-weight:700;font-size:13.5px;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}
.lvl{display:flex;align-items:center;gap:12px}
.lvl .badge{width:46px;height:46px;border-radius:14px;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:22px;flex:none}
.ready{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ready button{background:var(--surface2);border-radius:14px;padding:12px 6px;font-weight:700;font-size:13px;border:1.5px solid transparent;display:flex;flex-direction:column;align-items:center;gap:4px}
.ready button b{font-family:var(--f-display);font-size:22px;line-height:1}
.ready button.on{border-color:var(--accent);background:var(--accent-soft)}
.macro{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

    catch(e){toast('File không đúng định dạng sao lưu LazyGym')}};

/* ============ engine ============ */
const P=()=>S.profile;
function program(){const p=P();if(p.program==='vifit')return PROGRAMS.vifit;const n=p.days.length;return n<=3?PROGRAMS.fb:n===4?PROGRAMS.ul:n===5?PROGRAMS.ppl5:PROGRAMS.ppl6}
function eqOk(x,eq){return eq==='gym'?true:eq==='db'?(x.eq==='db'||x.eq==='bw'):x.eq==='bw'}
function resolve(p,used){
  if(EX[p])return p;
  const c=(PAT[p]||[]).filter(id=>!used.has(id)&&eqOk(EX[id],P().eq));
  return c.find(id=>EX[id].lv<=P().level)||c[0]||null;
}
function alternatives(id){
  const pats=Object.keys(PAT).filter(k=>PAT[k].includes(id));
  const set=new Set();pats.forEach(k=>PAT[k].forEach(x=>{if(x!==id&&eqOk(EX[x],P().eq))set.add(x)}));
  return [...set];
}
const isDb=x=>x.eq==='db';
const incOf=x=>isDb(x)?1:2.5;
function roundW(w,x){const s=incOf(x);let r=Math.round(w/s)*s;if(x.bar)r=Math.max(20,r);return Math.max(0,+r.toFixed(2))}
function startW(id){
  const x=EX[id];if(x.bw)return 0;
  const p=P();const lv=[0,.55,.8,1.05][p.level];const g=p.goal==='strength'?1.1:p.goal==='fat'?.85:1;
  const sex=p.sex==='f'?.7:1;
  return roundW((p.weight||65)*x.k*lv*g*sex,x);
}
function cycleWeek(k){const d=Math.max(0,diffD(P().created,k));return Math.floor(d/7)%4}
const isDeload=k=>cycleWeek(k)===3;
function rangeFor(id){const g=GOALS[P().goal];const x=EX[id];const r=x.c?g.c:g.i;if(x.time)return[3,30,60,60];if(x.bw&&!x.c)return[r[0],12,20,r[3]];if(x.bw)return[r[0],Math.max(r[1],8),Math.max(r[2],15),r[3]];return r}
function progOf(id){
  if(!S.prog[id]){const r=rangeFor(id);S.prog[id]={w:startW(id),tr:r[1],f:0,n:0}}
  return S.prog[id];
}
const isSched=k=>P().days.includes(wdOf(k));
function planTotals(plan){let t=0,d=0;if(!plan)return{t:0,d:0};plan.ex.forEach(e=>e.sets.forEach(s=>{t++;if(s.done)d++}));if(plan.cardio){t++;if(plan.cardio.done)d++}return{t,d}}
function prevTraining(k){for(let i=1;i<=6;i++){const q=addD(k,-i);const d=S.days[q];if(d&&d.plan&&d.started)return{k:q,d}}return null}
function missedCount(k){let n=0;let q=addD(k,-1);for(let i=0;i<14&&q>=P().created;i++){const d=S.days[q];if(d&&d.finished)break;if(isSched(q)&&!(d&&d.started))n++;q=addD(q,-1)}return n}
function isTrainDay(k){return isSched(k)||!!(S.days[k]&&S.days[k].plan)||S.adapt.makeup===k}

function buildPlan(k){
  const prog=program();const idx=S.adapt.rot%prog.days.length;const tpl=prog.days[idx];
  const used=new Set();const ids=[];
  tpl.p.forEach(p=>{const id=resolve(p,used);if(id){used.add(id);ids.push(id)}});
  const cnt=P().program==='vifit'?6:[0,4,5,6][P().level];
  const pick=ids.slice(0,cnt);
  const deload=isDeload(k);
  const day=S.days[k];const ready=day&&day.ready;
  const missed=missedCount(k);
  let mul=S.adapt.volMul*(deload?.6:1)*(missed>=2?.85:1);
  const notes=[];
  const ex=pick.map((id,i)=>{
    const x=EX[id];const r=rangeFor(id);const pr=progOf(id);
    let sets=Math.max(2,Math.round(r[0]*mul));
    if(i===0&&x.c&&!deload)sets+=1;
    if(P().level===3&&x.c&&!deload)sets+=1;
    if(ready===1)sets=Math.max(2,sets-1);
    const w=deload?roundW(pr.w*.9,x):pr.w;
    return{id,tr:[r[1],r[2]],rest:r[3],w,sets:Array.from({length:sets},()=>({w,r:pr.tr,done:false})),extra:0};
  });
  // carry-over from the previous unfinished session
  const prev=prevTraining(k);let carry=0;
  if(prev&&!deload){const t=planTotals(prev.d.plan);const miss=t.t-t.d;if(miss>0){carry=Math.min(4,Math.ceil(miss/2));let left=carry;
    for(let pass=0;pass<2&&left>0;pass++)for(const e of ex){if(left<=0)break;if(!EX[e.id].c)continue;e.sets.push({w:e.w,r:progOf(e.id).tr,done:false});e.extra++;left--}
    carry-=left;}}
  if(ready===3&&!deload&&ex[0]){ex[0].sets.push({w:ex[0].w,r:progOf(ex[0].id).tr,done:false});ex[0].extra++}
  const g=GOALS[P().goal];
  const cardio=g.cardio?{min:Math.round(g.cardio*(deload?.7:1)),done:false}:null;
  return{name:tpl.n,idx,ex,cardio,carry,deload,missed,mul:+mul.toFixed(2)};
}
function habitTargets(k){
  const p=P();const g=GOALS[p.goal];
  const base={steps:p.steps||g.steps,water:p.water||8,protein:Math.round((p.weight||65)*(p.protK||1.8)/5)*5,sleep:p.sleep||7.5,stepsCarry:0};
  const y=S.days[addD(k,-1)];
  if(y&&y.habits&&y.targets&&y.habits.steps>0){
    const def=Math.max(0,(y.targets.steps||base.steps)-y.habits.steps);
    const c=Math.min(Math.round(def*.5/500)*500,Math.round(base.steps*.3/500)*500);
    base.steps+=c;base.stepsCarry=c;
  }
  return base;
}
function getDay(k,create){
  if(!S.days[k]&&create){S.days[k]={key:k,habits:{steps:0,water:0,protein:0,sleep:0},targets:habitTargets(k),food:[],updatedAt:0}}
  return S.days[k];
}
function todayPlan(){const k=today();const d=S.days[k];return d&&d.plan?d.plan:buildPlan(k)}
function nutrition(k){
  const p=P();const w=p.weight||65,h=p.height||165,a=p.age||25;
  let bmr,how;
  if(p.bf){const lbm=w*(1-p.bf/100);bmr=370+21.6*lbm;how='Katch-McArdle'}else{bmr=10*w+6.25*h-5*a+(p.sex==='f'?-161:5);how='Mifflin-St Jeor'}
  const act=(ACT[p.act??1]||ACT[1])[1];
  const tdee=bmr*act*1.0;
  const kf=p.kf??GOALS[p.goal].kf;
  const target=tdee*kf+(S.adapt.kcalAdj||0);
  const n=p.days.length;const bump=150;
  const train=target+bump*(7-n)/7, rest=target-bump*n/7;
  const kcal=Math.round((k&&isTrainDay(k)?train:rest)/10)*10;
  const prot=Math.round(w*(p.protK||1.8));const fat=Math.round(kcal*(p.fatP||.25)/9);
  const carb=Math.max(0,Math.round((kcal-prot*4-fat*9)/4));
  return{bmr:Math.round(bmr),tdee:Math.round(tdee),target:Math.round(target),train:Math.round(train/10)*10,rest:Math.round(rest/10)*10,kcal,prot,fat,carb,how,act};
}
function weekAvgW(endK){const arr=S.adapt.bw.filter(e=>e.d<=endK&&e.d>addD(endK,-7));if(!arr.length)return null;return arr.reduce((a,b)=>a+b.kg,0)/arr.length}
function adaptKcal(){
  const t=today();const wk=mondayOf(t);if(S.adapt.kcalWeek===wk)return null;
  const a=weekAvgW(addD(wk,-1)),b=weekAvgW(addD(wk,-8));
  S.adapt.kcalWeek=wk;
  if(a==null||b==null){touchState();return null}
  const rate=a-b;const p=P();const w=p.weight||65;const kf=p.kf??GOALS[p.goal].kf;
  const want=kf<1?-.005*w*(kf<=.8?1.4:kf<=.9?1:.5):kf>1?.0025*w*(kf>=1.2?2:1):0;
  let adj=0;
  if(want<0){if(rate>want*.5)adj=-100;else if(rate<want*1.6)adj=100}
  else if(want>0){if(rate<want*.5)adj=100;else if(rate>want*2)adj=-100}
  S.adapt.kcalAdj=clamp((S.adapt.kcalAdj||0)+adj,-500,500);touchState();
  return adj?{adj,rate}:null;
}
function e1rm(w,r){return w*(1+r/30)}
function dayVolume(d){let v=0;if(d&&d.plan)d.plan.ex.forEach(e=>{if(!EX[e.id].bw)e.sets.forEach(s=>{if(s.done)v+=s.w*s.r})});return v}
function xpTotal(){
  let x=0;for(const k in S.days){const d=S.days[k];
    if(d.plan){d.plan.ex.forEach(e=>e.sets.forEach(s=>{if(s.done)x+=2}));if(d.plan.cardio&&d.plan.cardio.done)x+=5;if(d.finished)x+=30}
    if(d.habits&&d.targets){if(d.habits.steps>=d.targets.steps)x+=5;if(d.habits.water>=d.targets.water)x+=5;if(d.targets.protein&&d.habits.protein>=d.targets.protein)x+=5}}
  x+=Object.keys(S.adapt.lessons).length*15+Object.keys(S.adapt.checkins).length*20;return x;
}
function levelOf(x){let i=0;LEVELS.forEach((l,j)=>{if(x>=l[0])i=j});const nx=LEVELS[i+1];return{i,name:LEVELS[i][1],next:nx?nx[0]:null,nextName:nx?nx[1]:null,base:LEVELS[i][0]}}
function streak(){
  const t=today();let n=0;let k=S.days[t]&&S.days[t].finished?t:addD(t,-1);
  for(let i=0;i<120&&k>=P().created;i++){const d=S.days[k];if(d&&d.finished)n++;else if(isSched(k))break;k=addD(k,-1)}
  return n;
}
function dayScore(k){
  const d=S.days[k];const tgt=(d&&d.targets)||habitTargets(k);const h=(d&&d.habits)||{steps:0,water:0,protein:0};
  const hab=(Math.min(1,h.steps/tgt.steps)+Math.min(1,h.water/tgt.water)+Math.min(1,(h.protein||0)/tgt.protein))/3;
  if(isTrainDay(k)){const t=planTotals(d&&d.plan?d.plan:null);const pl=d&&d.plan?t:planTotals(buildPlan(k));const w=pl.t?(d&&d.plan?t.d/t.t:0):0;return{all:w*.6+hab*.4,w,hab}}
  return{all:hab,w:null,hab};
}

/* ============ coach notes ============ */
function coachNotes(plan){
  const k=today();const n=[];const d=S.days[k];
  if(plan&&plan.deload)n.push(['info','↓','Tuần deload (tuần 4 của chu kỳ). Còn ~60% số set và 90% mức tạ để cơ thể hồi phục.']);
  if(plan&&plan.missed>=1)n.push(['carry','↻',`Bạn bỏ lỡ ${plan.missed} buổi theo lịch. Mình giữ nguyên buổi “${plan.name}” cho hôm nay, không dồn bài.${plan.missed>=2?' Khối lượng giảm 15% để quay lại an toàn.':''}`]);
  if(plan&&plan.carry>0){const names=plan.ex.filter(e=>e.extra).map(e=>EX[e.id].n);n.push(['carry','+'+plan.carry,`Buổi trước còn thiếu set. Hôm nay cộng thêm ${plan.carry} set vào ${names.join(', ')}.`])}
  if(plan&&!plan.deload){const ups=plan.ex.filter(e=>S.prog[e.id]&&S.prog[e.id].up);if(ups.length)n.push(['up','↑','Tăng tạ hôm nay: '+ups.map(e=>`${EX[e.id].n} ${fk(S.prog[e.id].prevW)}→${fk(e.w)} kg`).join(' · ')])}
  if(plan&&Math.abs(S.adapt.volMul-1)>=.05)n.push([S.adapt.volMul>1?'up':'down',Math.round(S.adapt.volMul*100)+'%',S.adapt.volMul>1?'Các buổi gần đây bạn thấy dễ, khối lượng tập đang được nâng lên.':'Các buổi gần đây khá nặng, khối lượng đang hạ nhẹ để bạn hồi phục.']);
  const tg=(d&&d.targets)||habitTargets(k);
  if(tg.stepsCarry>0)n.push(['carry','+'+(tg.stepsCarry/1000).toFixed(1).replace('.',',')+'k',`Hôm qua thiếu bước chân. Mục tiêu hôm nay tăng lên ${fmt(tg.steps)} bước.`]);
  if(!plan){const owed=missedCount(k);n.push(['info','z',owed?`Bạn còn ${owed} buổi chưa tập trong tuần. Có thể tập bù hôm nay, hoặc nghỉ và tập tiếp vào buổi kế tiếp.`:'Ngày nghỉ. Cơ lớn lên khi bạn nghỉ. Đi bộ đủ bước chân và ăn đủ đạm là hoàn thành.'])}
  if(!n.length){const prev=prevTraining(k);if(prev&&prev.d.finished){const t=planTotals(prev.d.plan);n.push(['up','✓',`Buổi trước hoàn thành ${Math.round(t.d/t.t*100)}%. Giữ nhịp này!`])}else n.push(['info','i','Làm đủ mọi set ở mức rep cao nhất thì buổi sau app tự tăng tạ.'])}
  return n;
}

/* ============ barbell hero ============ */
function barbell(pct){
  const cols=['var(--red)','var(--accent)','var(--yellow)','var(--green)','var(--plate5)'];
  const hs=[94,94,80,66,52];const lbl=['25','20','15','10','5'];
  const filled=Math.round(clamp(pct,0,1)*5);let s='';
  s+=`<rect x="6" y="52" width="308" height="6" rx="3" fill="var(--muted)" opacity=".55"/>`;
  s+=`<rect x="122" y="50" width="76" height="10" rx="2" fill="var(--muted)" opacity=".35"/>`;
  s+=`<rect x="100" y="44" width="8" height="22" rx="2" fill="var(--muted)"/><rect x="212" y="44" width="8" height="22" rx="2" fill="var(--muted)"/>`;
  for(let i=0;i<5;i++){
    const h=hs[i],y=55-h/2,on=i<filled;
    const xl=100-(i+1)*17,xr=220+i*17+3;
    const st=on?`fill="${cols[i]}"`:`fill="none" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="3 3"`;
    s+=`<rect x="${xl}" y="${y}" width="14" height="${h}" rx="3" ${st}/><rect x="${xr}" y="${y}" width="14" height="${h}" rx="3" ${st}/>`;
    if(on&&h>60){s+=`<text x="${xl+7}" y="${y+h-7}" text-anchor="middle" font-family="Barlow Condensed,Arial Narrow,sans-serif" font-size="9" font-weight="700" fill="${i===4?'var(--bg)':'#fff'}" opacity=".85">${lbl[i]}</text>`}
  }
  return `<svg class="bar-svg" viewBox="0 0 320 110" role="img" aria-label="Thanh tạ: đã nạp ${filled} trên 5 bánh mỗi bên">${s}</svg>`;
}

/* ============ render: shell ============ */
function render(){
  const app=$('#app');
  if(!P()){app.innerHTML=renderOnboarding();return}
  if(UI.view==='workout'){app.innerHTML=renderWorkout();return}
  const tabs={today:renderToday,plan:renderPlan,food:renderFood,progress:renderProgress,learn:renderLearn};
  app.innerHTML=header()+`<main class="stack" style="padding-top:4px">${(tabs[UI.tab]||renderToday)()}</main>`+tabbar();
}
function header(){
  const lv=levelOf(xpTotal());const name=P().name||'Bạn';

}
function tabbar(){
  const t=[['today','Hôm nay',I.home],['plan','Kế hoạch',I.plan],['food','Ăn uống',I.food],['progress','Tiến bộ',I.prog],['learn','Học',I.learn]];

/* ============ today ============ */
function renderToday(){

  const sc=dayScore(k);const tt=plan?planTotals(plan):null;
  const nut=nutrition(k);const eaten=foodTotals(d);
  const dt=toD(k);const greet=(()=>{const hr=new Date().getHours();return hr<11?'Chào buổi sáng':hr<14?'Chào buổi trưa':hr<18?'Chào buổi chiều':'Chào buổi tối'})();
  let s=`<section><p class="muted small" style="font-weight:700">${WDL[dt.getDay()]}, ${dt.getDate()}/${dt.getMonth()+1} · Tuần ${cycleWeek(k)+1}/4 ${isDeload(k)?'· deload':''}</p><h1 class="d" style="font-size:30px;text-transform:uppercase;line-height:1.05;margin-top:2px">${greet}${P().name?', '+esc(P().name):''}</h1></section>`;
  s+=`<section class="card hero"><div class="hero-top"><div><p class="eyebrow">Mục tiêu hôm nay</p><div class="pct">${Math.round(sc.all*100)}<small>%</small></div></div><div style="text-align:right"><span class="pill ${sc.all>=1?'good':sc.all>=.5?'acc':''}">${sc.all>=1?'Đã hoàn thành':train?(d&&d.finished?'Đã tập xong':'Ngày tập'):'Ngày nghỉ'}</span><p class="small muted" style="margin-top:6px">${streak()} buổi liên tiếp</p></div></div>
  ${barbell(sc.all)}
  <div class="metrics">
   <div class="metric"><div class="v">${tt?tt.d:'–'}<span>/${tt?tt.t:'0'}</span></div><div class="l">Set đã tập</div><div class="meter"><b style="width:${tt&&tt.t?tt.d/tt.t*100:0}%"></b></div></div>
   <div class="metric"><div class="v">${(h.steps/1000).toFixed(1).replace('.',',')}<span>/${(tg.steps/1000).toFixed(1).replace('.',',')}k</span></div><div class="l">Bước chân</div><div class="meter"><b style="width:${Math.min(100,h.steps/tg.steps*100)}%;background:var(--green)"></b></div></div>
   <div class="metric"><div class="v">${fmt(eaten.k)}<span>/${fmt(nut.kcal)}</span></div><div class="l">Kcal</div><div class="meter"><b style="width:${Math.min(100,eaten.k/nut.kcal*100)}%;background:var(--yellow)"></b></div></div>
  </div></section>`;
  // level up prompt
  const lv=levelOf(xpTotal());
  if((P().level<2&&lv.i>=3)||(P().level<3&&lv.i>=4)){s+=`<section class="card" style="border-color:var(--accent)"><div class="lvl"><span class="badge">${lv.i+1}</span><div class="grow"><h3>Bạn đã sẵn sàng lên cấp</h3><p class="small muted">Điểm kinh nghiệm đạt mức ${esc(lv.name)}. Nâng chương trình lên ${LVN[P().level+1]}: thêm bài và thêm set.</p></div></div><button class="btn sm" style="margin-top:12px" data-a="levelup">Nâng lên ${LVN[P().level+1]}</button></section>`}
  // coach
  s+=`<section class="card"><div class="card-h"><p class="eyebrow">Huấn luyện viên</p><span class="pill acc">Tự điều chỉnh</span></div><div class="coach">${coachNotes(plan).map(n=>`<div class="note"><span class="ic ${n[0]}">${esc(n[1])}</span><p>${esc(n[2])}</p></div>`).join('')}</div></section>`;
  // workout
  if(plan){
    const started=d&&d.started;const fin=d&&d.finished;
    const mins=Math.round(plan.ex.reduce((a,e)=>a+e.sets.length*(45+e.rest),0)/60+(plan.cardio?plan.cardio.min:0)+5);
    s+=`<section class="card"><div class="card-h"><div><p class="eyebrow">Buổi tập · ${esc(program().n)}</p><h2 style="margin-top:2px">${esc(plan.name)}</h2></div><span class="pill">${mins} phút</span></div>`;
    if(!started){
      s+=`<p class="lab" style="margin-bottom:8px">Hôm nay bạn thấy thế nào?</p><div class="ready" style="margin-bottom:12px">${[[1,'Mệt','−1 set/bài'],[2,'Bình thường','Giữ kế hoạch'],[3,'Sung sức','+1 set bài chính']].map(r=>`<button class="${(d&&d.ready||2)===r[0]?'on':''}" data-a="ready" data-v="${r[0]}"><b>${r[1]}</b><span class="muted" style="font-size:11.5px">${r[2]}</span></button>`).join('')}</div>`;
    }
    s+=`<div class="exlist">${plan.ex.map((e,i)=>{const x=EX[e.id];const dn=e.sets.filter(q=>q.done).length;const up=S.prog[e.id]&&S.prog[e.id].up&&!plan.deload;
      return `<button class="exrow" data-a="exinfo" data-v="${e.id}" style="text-align:left;width:100%"><span class="n">${pad(i+1)}</span><span><span class="t">${esc(x.n)}</span><br><span class="s">${e.sets.length} set × ${x.time?e.sets[0].r+' giây':e.tr[0]+'–'+e.tr[1]+' rep'}${e.extra?' · <b style="color:var(--warn)">+'+e.extra+' bù</b>':''}${started?' · '+dn+'/'+e.sets.length+' xong':''}</span></span><span class="w">${x.bw?'<small>BW</small>':fk(e.w)+'<small> kg</small>'}${up?'<br><span class="tag-up">▲ tăng</span>':''}</span></button>`}).join('')}
    ${plan.cardio?`<div class="exrow"><span class="n">${pad(plan.ex.length+1)}</span><span><span class="t">Cardio cuối buổi</span><br><span class="s">Đạp xe, chạy bộ nhẹ hoặc leo dốc</span></span><span class="w">${plan.cardio.min}<small> ph</small></span></div>`:''}</div>
    <div style="margin-top:14px">${fin?`<button class="btn ghost" data-a="openwk">Xem lại buổi tập</button>`:`<button class="btn" data-a="startwk">${started?'Tiếp tục tập':'Bắt đầu tập'}</button>`}</div></section>`;
  }else{
    const prog=program();const nx=prog.days[S.adapt.rot%prog.days.length];
    let nd=addD(k,1);for(let i=0;i<7&&!isSched(nd);i++)nd=addD(nd,1);
    s+=`<section class="card"><p class="eyebrow">Buổi kế tiếp</p><h2 style="margin-top:2px">${esc(nx.n)}</h2><p class="small muted" style="margin-top:4px">${WDL[wdOf(nd)]}, ${toD(nd).getDate()}/${toD(nd).getMonth()+1}</p><button class="btn ghost sm" style="margin-top:12px" data-a="makeup">Tập buổi này ngay hôm nay</button></section>`;
  }
  s+=renderHabits(k);
  s+=`<section class="card"><div class="lvl"><span class="badge">${lv.i+1}</span><div class="grow"><div class="row between"><h3>${esc(lv.name)}</h3><span class="small muted num" style="font-size:15px">${fmt(xpTotal())} XP</span></div><div class="meter" style="height:6px"><b style="width:${lv.next?(xpTotal()-lv.base)/(lv.next-lv.base)*100:100}%"></b></div><p class="small muted" style="margin-top:6px">${lv.next?`Còn ${fmt(lv.next-xpTotal())} XP tới ${esc(lv.nextName)}. Mỗi set +2, mỗi buổi xong +30.`:'Cấp cao nhất. Bạn đã là dân chuyên.'}</p></div></div></section>`;
  return s;
}
function renderHabits(k){
  const d=S.days[k];const tg=(d&&d.targets)||habitTargets(k);const h=(d&&d.habits)||{steps:0,water:0,protein:0,sleep:0};
  const cups=Array.from({length:Math.max(tg.water,h.water)},(_,i)=>`<button class="cup ${i<h.water?'on':''}" data-a="water" data-v="${i+1}" aria-label="${i+1} cốc nước"></button>`).join('');
  return `<section class="card"><div class="card-h"><p class="eyebrow">Thói quen hằng ngày</p><span class="small muted">Chạm để ghi</span></div>
  <div class="habit"><div><p class="lab">Bước chân${tg.stepsCarry?` · <span style="color:var(--warn)">+${fmt(tg.stepsCarry)} bù</span>`:''}</p><div class="hv">${fmt(h.steps)}<span> / ${fmt(tg.steps)}</span></div></div><div class="row"><button class="mini" data-a="steps" data-v="-1000">−1k</button><button class="mini acc" data-a="steps" data-v="1000">+1k</button><button class="mini acc" data-a="steps" data-v="2500">+2,5k</button></div><div class="meter"><b style="width:${Math.min(100,h.steps/tg.steps*100)}%;background:var(--green)"></b></div></div>
  <div class="habit"><div><p class="lab">Nước (cốc 250 ml)</p><div class="hv">${h.water}<span> / ${tg.water}</span></div></div><button class="mini" data-a="water" data-v="${Math.max(0,h.water-1)}">−1</button><div class="cups">${cups}</div></div>
  <div class="habit"><div><p class="lab">Đạm (protein)</p><div class="hv">${fmt(h.protein||0)}<span> / ${tg.protein} g</span></div></div><div class="row"><button class="mini" data-a="prot" data-v="-10">−10</button><button class="mini acc" data-a="prot" data-v="25">+25 g</button></div><div class="meter"><b style="width:${Math.min(100,(h.protein||0)/tg.protein*100)}%;background:var(--yellow)"></b></div></div>
  <div class="habit"><div><p class="lab">Giấc ngủ đêm qua</p><div class="hv">${fk(h.sleep||0)}<span> / ${fk(tg.sleep)} giờ</span></div></div><div class="row"><button class="mini" data-a="sleep" data-v="-0.5">−½</button><button class="mini acc" data-a="sleep" data-v="0.5">+½</button></div></div>
  </section>`;
}

/* ============ workout ============ */
let wkTick=null,restT=null,REST=null,wakeLock=null,actx=null;
function renderWorkout(){
  const k=today();const d=S.days[k];if(!d||!d.plan){UI.view='main';return renderToday()}
  const plan=d.plan;const t=planTotals(plan);
  let s=`<div class="wk-top"><div class="row between"><button class="mini" data-a="closewk">‹ Thu nhỏ</button><div style="text-align:center"><p class="eyebrow">${esc(plan.name)}</p><div class="num" id="elapsed" style="font-size:22px;font-weight:700">${elapsed(d)}</div></div>${d.finished?'<span class="pill good">Đã xong</span>':`<button class="mini acc" data-a="finishwk">Xong</button>`}</div><div class="wk-bar"><b style="width:${t.t?t.d/t.t*100:0}%"></b></div></div><div class="stack" style="padding-bottom:110px">`;
  if(plan.carry||plan.deload)s+=`<div class="card flat small">${plan.deload?'Tuần deload: tạ 90%, ít set hơn. Tập nhẹ nhàng, tập trung kỹ thuật.':''} ${plan.carry?`Có ${plan.carry} set bù từ buổi trước (đánh dấu <b style="color:var(--warn)">bù</b>).`:''}</div>`;
  plan.ex.forEach((e,i)=>{
    const x=EX[e.id];const pr=S.prog[e.id];const allDone=e.sets.every(q=>q.done);
    const last=lastPerf(e.id,k);
    s+=`<section class="excard ${allDone?'done':''}"><div class="exhead"><div class="grow"><p class="eyebrow">${pad(i+1)} · ${esc(x.m)}</p><h3>${esc(x.n)}</h3><p class="small muted">${x.time?'Giữ':'Mục tiêu'} ${x.time?e.sets[0].r+' giây':e.tr[0]+'–'+e.tr[1]+' rep'} · nghỉ ${e.rest}s${last?` · lần trước ${last}`:''}</p>${x.bar&&e.w>20?`<div class="plates" style="margin-top:4px">Mỗi bên: ${plateStr(e.sets.find(q=>!q.done)?.w??e.w)}</div>`:''}</div><div class="row" style="gap:6px"><button class="mini" data-a="exinfo" data-v="${e.id}" aria-label="Hướng dẫn">?</button>${!d.finished?`<button class="mini" data-a="swap" data-e="${i}" aria-label="Đổi bài">⇄</button>`:''}</div></div>
    <div class="setgrid sethead"><span>Set</span><span>${x.bw?'Tạ thêm':'Kg'}</span><span>${x.time?'Giây':'Rep'}</span><span></span></div>`;
    e.sets.forEach((q,j)=>{
      const isExtra=j>=e.sets.length-e.extra;
      s+=`<div class="setgrid setrow ${q.done?'on':''}"><span class="sn">${j+1}</span>
      <div class="step"><button data-a="adj" data-e="${i}" data-s="${j}" data-f="w" data-v="-1" aria-label="Giảm tạ">−</button><input id="w-${i}-${j}" inputmode="decimal" value="${fk(q.w)}" data-in="w" data-e="${i}" data-s="${j}" aria-label="Mức tạ set ${j+1}"><button data-a="adj" data-e="${i}" data-s="${j}" data-f="w" data-v="1" aria-label="Tăng tạ">+</button></div>
      <div class="step"><button data-a="adj" data-e="${i}" data-s="${j}" data-f="r" data-v="-1" aria-label="Giảm rep">−</button><input id="r-${i}-${j}" inputmode="numeric" value="${q.r}" data-in="r" data-e="${i}" data-s="${j}" aria-label="Số rep set ${j+1}"><button data-a="adj" data-e="${i}" data-s="${j}" data-f="r" data-v="1" aria-label="Tăng rep">+</button></div>
      <button class="check" data-a="done" data-e="${i}" data-s="${j}" aria-label="Hoàn thành set ${j+1}" aria-pressed="${q.done}">${I.check}</button>
      ${isExtra?`<span class="prev" style="color:var(--warn)">Set bù</span>`:''}</div>`;
    });
    if(!d.finished)s+=`<div class="row" style="justify-content:flex-end;margin-top:6px;gap:6px">${e.sets.length>1?`<button class="mini" data-a="delset" data-e="${i}">− Bớt set</button>`:''}<button class="mini" data-a="addset" data-e="${i}">+ Thêm set</button></div>`;
    s+=`</section>`;
  });
  if(plan.cardio)s+=`<section class="excard ${plan.cardio.done?'done':''}"><div class="row between"><div><p class="eyebrow">Kết thúc</p><h3>Cardio ${plan.cardio.min} phút</h3><p class="small muted">Nhịp tim vừa phải, vẫn nói chuyện được</p></div><button class="check ${plan.cardio.done?'on':''}" data-a="cardio" aria-pressed="${plan.cardio.done}">${I.check}</button></div></section>`;
  if(!d.finished)s+=`<button class="btn" data-a="finishwk">Hoàn thành buổi tập</button>`;
  else s+=`<button class="btn ghost" data-a="closewk">Về trang chính</button>`;
  return s+'</div>';
}
function elapsed(d){if(!d.started)return'00:00';const end=d.finished||Date.now();const s=Math.max(0,Math.floor((end-d.started)/1000));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+':':'')+pad(m)+':'+pad(x)}
function lastPerf(id,before){
  const ks=Object.keys(S.days).filter(k=>k<before).sort().reverse();
  for(const k of ks){const d=S.days[k];if(!d.plan)continue;const e=d.plan.ex.find(z=>z.id===id);if(e){const dn=e.sets.filter(q=>q.done);if(dn.length){const b=dn.reduce((a,q)=>e1rm(q.w,q.r)>e1rm(a.w,a.r)?q:a);return EX[id].bw?`${b.r} rep`:`${fk(b.w)}×${b.r}`}}}
  return null;
}
function plateStr(w){
  let side=(w-20)/2;if(side<=0)return'chỉ thanh đòn';const ps=[[25,'var(--red)',22],[20,'var(--accent)',22],[15,'var(--yellow)',19],[10,'var(--green)',16],[5,'var(--plate5)',13],[2.5,'var(--muted)',11],[1.25,'var(--muted)',9]];
  const out=[];for(const[p,c,h]of ps){while(side>=p-1e-9){out.push(`<i style="height:${h}px;background:${c}" title="${p}"></i>`);side-=p}}
  const txt=[];let s2=(w-20)/2;for(const[p]of ps){let n=0;while(s2>=p-1e-9){n++;s2-=p}if(n)txt.push((n>1?n+'×':'')+fk(p))}

function startRest(sec,label){

function beep(){try{if(!actx)return;const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;g.gain.setValueAtTime(.001,actx.currentTime);g.gain.exponentialRampToValueAtTime(.3,actx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+.5);o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+.5)}catch(e){}try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}

function finishWorkout(rpe){
  const k=today();const d=S.days[k];const plan=d.plan;d.finished=Date.now();d.rpe=rpe;
  const t=planTotals(plan);const comp=t.t?t.d/t.t:0;const changes=[];const prs=[];
  plan.ex.forEach(e=>{
    const x=EX[e.id];const p=progOf(e.id);const ds=e.sets.filter(q=>q.done);
    p.up=false;
    if(!ds.length)return;
    ds.forEach(q=>{if(x.bw)return;const v=e1rm(q.w,q.r);const old=S.adapt.best[e.id]||0;if(v>old+.01){if(old)prs.push(`${x.n}: ${fk(q.w)} kg × ${q.r}`);S.adapt.best[e.id]=+v.toFixed(1)}});
    if(plan.deload){return}
    const allDone=ds.length===e.sets.length;const minR=Math.min(...ds.map(q=>q.r));
    const workW=x.bw?p.w:Math.max(...ds.map(q=>q.w));p.n=(p.n||0)+1;
    if(x.bw){if(allDone&&minR>=p.tr){const cap=x.time?120:30;const nt=Math.min(p.tr+(x.time?5:1),cap);if(nt>p.tr){p.tr=nt;changes.push(`${x.n}: mục tiêu ${nt}${x.time?' giây':' rep'}`)}}return}
    p.w=workW;
    if(allDone&&minR>=e.tr[1]){const nw=roundW(workW+incOf(x),x);p.prevW=workW;p.w=nw;p.tr=e.tr[0];p.up=true;p.f=0;changes.push(`${x.n}: ${fk(workW)} → ${fk(nw)} kg`)}
    else if(allDone&&minR>=p.tr){const nt=Math.min(p.tr+1,e.tr[1]);p.f=0;if(nt>p.tr){p.tr=nt;changes.push(`${x.n}: giữ ${fk(p.w)} kg, lên ${nt} rep`)}}
    else if(minR<e.tr[0]){p.f=(p.f||0)+1;if(p.f>=2){const nw=roundW(workW*.9,x);changes.push(`${x.n}: giảm về ${fk(nw)} kg để lấy lại form`);p.w=nw;p.f=0;p.tr=e.tr[0]}else changes.push(`${x.n}: giữ ${fk(p.w)} kg, thử lại`)}
  });
  const old=S.adapt.volMul;
  if(!plan.deload){if(comp>=1&&rpe<=1)S.adapt.volMul=Math.min(1.3,+(old+.05).toFixed(2));else if(rpe>=4||comp<.6)S.adapt.volMul=Math.max(.8,+(old-.05).toFixed(2));else if(rpe===2&&old<1)S.adapt.volMul=Math.min(1,+(old+.05).toFixed(2))}
  S.adapt.rot=plan.idx+1;if(S.adapt.makeup===k)S.adapt.makeup=null;
  try{wakeLock&&wakeLock.release()}catch(e){}
  touchDay(k);touchState();
  return{comp,changes,prs,vol:dayVolume(d),sets:t.d,volChange:S.adapt.volMul-old,time:elapsed(d)};
}

  ${ci?`<div class="row wrap" style="gap:6px;margin-top:10px">${ci.waist?`<span class="pill">Eo ${fk(ci.waist)} cm</span>`:''}${ci.bf?`<span class="pill">Mỡ ${fk(ci.bf)}%</span>`:''}<span class="pill">Năng lượng ${ci.energy}</span><span class="pill">Đói ${ci.hunger}</span><span class="pill">Căng thẳng ${ci.stress}</span><span class="pill">Ngủ ${ci.sleep}</span></div>`:''}
  <button class="btn ${ci?'ghost':''} sm" style="margin-top:12px" data-a="checkin">${ci?'Sửa check-in':'Check-in 30 giây'}</button></section>`;
  // PRs
  const prs=Object.keys(S.adapt.best).filter(id=>EX[id]).sort((a,b)=>S.adapt.best[b]-S.adapt.best[a]);
  s+=`<section class="card"><div class="card-h"><p class="eyebrow">Kỷ lục cá nhân · 1RM ước tính</p></div>`;
  s+=prs.length?`<div>${prs.map(id=>`<button class="li" data-a="exinfo" data-v="${id}"><span class="ix on">PR</span><span class="tx"><b>${esc(EX[id].n)}</b><span>Đang tập ${fk(S.prog[id]?.w)} kg × ${S.prog[id]?.tr} rep</span></span><span class="rt">${fk(Math.round(S.adapt.best[id]*2)/2)}<small class="muted" style="font-size:12px"> kg</small></span></button>`).join('')}</div>`:`<p class="small muted">Hoàn thành buổi đầu tiên để thấy sức mạnh ước tính của từng bài. Công thức Epley: tạ × (1 + rep/30).</p>`;
  return s+'</section>';
}

}
function summarySheet(r){
  openSheet(`<p class="eyebrow">Đã hoàn thành</p><div class="pct" style="margin:4px 0 6px">${Math.round(r.comp*100)}<small>%</small></div>${barbell(r.comp)}
  <div class="metrics" style="margin:8px 0 14px"><div class="metric"><div class="v">${r.sets}</div><div class="l">Set</div></div><div class="metric"><div class="v">${fk(+(r.vol/1000).toFixed(2))}<span> t</span></div><div class="l">Khối lượng</div></div><div class="metric"><div class="v" style="font-size:19px">${r.time}</div><div class="l">Thời gian</div></div></div>
  ${r.prs.length?`<div class="card" style="margin-bottom:10px;border-color:var(--green)"><h3 style="color:var(--good);margin-bottom:6px">Kỷ lục mới</h3>${r.prs.map(p=>`<p class="small">${esc(p)}</p>`).join('')}</div>`:''}
  <div class="card"><h3 style="margin-bottom:6px">Buổi sau app sẽ</h3>${r.changes.length?r.changes.map(c=>`<p class="small" style="padding:3px 0">${esc(c)}</p>`).join(''):'<p class="small muted">Giữ nguyên mức tạ. Tuần deload không đổi tạ.</p>'}${Math.abs(r.volChange)>.001?`<p class="small" style="padding:3px 0;color:${r.volChange>0?'var(--good)':'var(--warn)'}">${r.volChange>0?'Tăng':'Giảm'} khối lượng tổng ${Math.round(Math.abs(r.volChange)*100)}%</p>`:''}${r.comp<1?`<p class="small" style="padding:3px 0;color:var(--warn)">Thiếu ${Math.round((1-r.comp)*100)}% mục tiêu: một phần set sẽ được bù vào buổi tới.</p>`:''}</div>
  <button class="btn" style="margin-top:14px" data-a="closesum">Tuyệt vời</button>`);
}

/* ============ actions ============ */
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2400)}
function setTab(t){UI.tab=t;try{localStorage.setItem(LS+'.ui',JSON.stringify({tab:t}))}catch(e){}render();window.scrollTo(0,0)}
function wkSet(e,s){return S.days[today()].plan.ex[+e].sets[+s]}
let resetArm=0;
const A={
 tab:el=>setTab(el.dataset.v),
 settings:()=>settingsSheet(),
 closesheet:(el,ev)=>{if(ev.target===el)closeSheet()},
 ob:el=>{const k=el.dataset.k;let v=el.dataset.v;if(k==='level')v=+v;OB[k]=v;if(k==='program'&&v==='vifit'){OB.days=[1,2,4,5];OB.eq='gym'}render()},
 obday:el=>{const w=+el.dataset.v;OB.days=OB.days.includes(w)?OB.days.filter(x=>x!==w):[...OB.days,w];if(OB.program==='vifit'&&OB.days.length!==4)OB.program='auto';render()},
 create:()=>{
  if(OB.days.length<2)return;
  const n=v=>{const x=parseFloat(String(v).replace(',','.'));return isFinite(x)&&x>0?x:null};
  S.profile={name:OB.name.trim(),sex:OB.sex,goal:OB.goal,level:OB.level,days:[...OB.days].sort(),eq:OB.eq,weight:n(OB.weight)||65,height:n(OB.height)||165,age:n(OB.age)||25,bf:n(OB.bf),target:n(OB.target),program:OB.program,created:today(),act:1,steps:GOALS[OB.goal].steps,water:8,protK:1.8,fatP:.25};
  S.adapt=defAdapt();S.prog={};
  if(OB.program==='vifit'){const r=GOALS[OB.goal];Object.entries(VIFIT_W).forEach(([id,w])=>{if(EX[id])S.prog[id]={w,tr:rangeFor(id)[1],f:0,n:0}})}
  S.adapt.bw=[{d:today(),kg:S.profile.weight}];
  touchState();UI.tab='today';render();window.scrollTo(0,0);toast('Đã tạo kế hoạch. Bắt đầu thôi!');
 },
 ready:el=>{const d=getDay(today(),true);d.ready=+el.dataset.v;touchDay(today());render()},
 startwk:()=>{
  const k=today();const d=getDay(k,true);if(!d.plan)d.plan=buildPlan(k);if(!d.started)d.started=Date.now();
  touchDay(k);UI.view='workout';render();window.scrollTo(0,0);startTick();lockScreen();
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume&&actx.resume()}catch(e){}
 },
 openwk:()=>{UI.view='workout';render();window.scrollTo(0,0)},
 closewk:()=>{UI.view='main';REST=null;drawRest();render();window.scrollTo(0,0)},
 makeup:()=>{S.adapt.makeup=today();touchState();render();toast('Đã chuyển buổi tập sang hôm nay')},
 exinfo:el=>exSheet(el.dataset.v),
 adj:el=>{const q=wkSet(el.dataset.e,el.dataset.s);const e=S.days[today()].plan.ex[+el.dataset.e];const x=EX[e.id];const v=+el.dataset.v;
  if(el.dataset.f==='w'){q.w=Math.max(0,+(q.w+v*(x.bw?2.5:incOf(x))).toFixed(2));e.sets.forEach((z,j)=>{if(j>+el.dataset.s&&!z.done)z.w=q.w})}
  else q.r=Math.max(0,q.r+v*(x.time?5:1));
  touchDay(today());render()},
 done:el=>{const k=today();const e=S.days[k].plan.ex[+el.dataset.e];const q=e.sets[+el.dataset.s];q.done=!q.done;touchDay(k);render();
  if(q.done){const last=e.sets.every(z=>z.done);const ni=+el.dataset.e+1;const nx=S.days[k].plan.ex[ni];startRest(last?Math.min(e.rest,90):e.rest,last?(nx?'Tiếp: '+EX[nx.id].n:'Bài cuối xong!'):EX[e.id].n)}},
 addset:el=>{const e=S.days[today()].plan.ex[+el.dataset.e];const l=e.sets[e.sets.length-1];e.sets.push({w:l.w,r:l.r,done:false});touchDay(today());render()},
 delset:el=>{const e=S.days[today()].plan.ex[+el.dataset.e];if(e.sets.length>1){e.sets.pop();e.extra=Math.min(e.extra,e.sets.length)}touchDay(today());render()},
 swap:el=>{const i=+el.dataset.e;const plan=S.days[today()].plan;const e=plan.ex[i];const inPlan=new Set(plan.ex.map(z=>z.id));const alts=alternatives(e.id).filter(a=>!inPlan.has(a));
  openSheet(`<h2 style="margin-bottom:6px">Đổi bài</h2><p class="small muted" style="margin-bottom:10px">Máy bận hoặc đau khớp? Chọn bài thay thế cùng nhóm cơ.</p>${alts.map(a=>`<button class="li" data-a="doswap" data-e="${i}" data-v="${a}"><span class="tx"><b>${esc(EX[a].n)}</b><span>${esc(EX[a].m)}</span></span><span class="rt">${EX[a].bw?'BW':fk(progOf(a).w)}</span></button>`).join('')||'<p class="small muted">Không có bài thay thế phù hợp dụng cụ của bạn.</p>'}`)},
 doswap:el=>{const plan=S.days[today()].plan;const e=plan.ex[+el.dataset.e];const id=el.dataset.v;const pr=progOf(id);const r=rangeFor(id);e.id=id;e.tr=[r[1],r[2]];e.rest=r[3];e.w=pr.w;e.sets=e.sets.map(q=>q.done?q:{w:pr.w,r:pr.tr,done:false});touchDay(today());closeSheet();render()},
 cardio:()=>{const p=S.days[today()].plan;p.cardio.done=!p.cardio.done;touchDay(today());render()},
 restadj:el=>{if(REST){REST.end+=(+el.dataset.v)*1000;REST.beeped=0;drawRest()}},
 restskip:()=>{REST=null;drawRest()},
 finishwk:()=>finishSheet(),
 rpe:el=>{const r=finishWorkout(+el.dataset.v);REST=null;drawRest();summarySheet(r)},
 closesum:()=>{closeSheet();UI.view='main';render();window.scrollTo(0,0)},
 steps:el=>{const k=today();const d=getDay(k,true);d.habits.steps=Math.max(0,d.habits.steps+(+el.dataset.v));touchDay(k);render()},
 water:el=>{const k=today();const d=getDay(k,true);const v=+el.dataset.v;d.habits.water=d.habits.water===v?v-1:v;touchDay(k);render()},
 prot:el=>{const k=today();const d=getDay(k,true);d.habits.protein=Math.max(0,(d.habits.protein||0)+(+el.dataset.v));touchDay(k);render()},
 sleep:el=>{const k=today();const d=getDay(k,true);d.habits.sleep=clamp((d.habits.sleep||0)+(+el.dataset.v),0,14);touchDay(k);render()},
 levelup:()=>{P().level=Math.min(3,P().level+1);touchState();render();toast('Đã nâng lên '+LVN[P().level])},
 learnm:el=>{UI.learnM=el.dataset.v;render()},
 lesson:el=>lessonSheet(el.dataset.v),
 lessondone:el=>{S.adapt.lessons[el.dataset.v]=today();touchState();closeSheet();render();toast('+15 XP')},
 savebw:()=>{const v=parseFloat(($('#bw-in').value||'').replace(',','.'));if(!(v>25&&v<300)){toast('Nhập cân nặng hợp lệ, ví dụ 65,5');return}
  const k=today();S.adapt.bw=S.adapt.bw.filter(e=>e.d!==k).concat([{d:k,kg:v}]).sort((a,b)=>a.d<b.d?-1:1);P().weight=v;touchState();render();toast('Đã lưu '+fk(v)+' kg')},
 checkin:()=>checkinSheet(),
 stpick:el=>{const g=$('#'+el.dataset.g);g.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===el))},
 sttoggle:el=>el.classList.toggle('on'),
 savecheckin:()=>{const pick=id=>{const b=$('#'+id+' .on');return b?+b.dataset.v:5};const n=id=>{const v=parseFloat(($('#'+id).value||'').replace(',','.'));return isFinite(v)?v:null};
  const c={waist:n('ci-waist'),bf:n('ci-bf'),energy:pick('ci-energy'),hunger:pick('ci-hunger'),stress:pick('ci-stress'),sleep:pick('ci-sleep')};
  S.adapt.checkins[mondayOf(today())]=c;if(c.bf)P().bf=c.bf;
  let msg='Đã lưu check-in';
  if(c.energy<=4||c.stress>=8||c.sleep<=4){S.adapt.volMul=Math.max(.8,+(S.adapt.volMul-.05).toFixed(2));msg='Đã lưu. Tuần này hơi mệt: giảm 5% khối lượng'}
  touchState();closeSheet();render();toast(msg)},
 savesettings:()=>{const p=P();const v=id=>$('#'+id).value;const n=id=>{const x=parseFloat(String(v(id)).replace(',','.'));return isFinite(x)&&x>0?x:null};const on=id=>$('#'+id+' .on')?.dataset.v;
  const days=[...document.querySelectorAll('#st-days .on')].map(b=>+b.dataset.v).sort();if(days.length<2){toast('Chọn ít nhất 2 ngày tập');return}
  const oldProg=program().n;
  p.name=v('st-name').trim();p.goal=on('st-goal')||p.goal;p.level=+(on('st-level')||p.level);p.eq=on('st-eq')||p.eq;p.days=days;p.program=on('st-prog')||p.program;
  ['weight','height','age','bf','target','steps'].forEach(f=>{const x=n('st-'+f);if(x!=null||f==='bf'||f==='target')p[f]=x});
  if(p.program==='vifit'){Object.entries(VIFIT_W).forEach(([id,w])=>{if(!S.prog[id])S.prog[id]={w,tr:rangeFor(id)[1],f:0,n:0}})}
  if(program().n!==oldProg)S.adapt.rot=0;
  const td=S.days[today()];if(td&&td.plan&&!td.started){delete td.plan;touchDay(today())}
  touchState();closeSheet();render();toast('Đã cập nhật kế hoạch')},
 reset:el=>{if(Date.now()-resetArm>4000){resetArm=Date.now();el.textContent='Chạm lần nữa để xóa hẳn';return}
  S={profile:null,prog:{},adapt:defAdapt(),days:{},updatedAt:Date.now()};saveLocal();
  closeSheet();render()},
 nutset:()=>nutSheet(),
 backup:()=>backupData(),
 savenut:()=>{const p=P();p.act=+$('#nt-act').value;p.kf=+$('#nt-kf').value;p.protK=+($('#nt-prot .on')?.dataset.v||1.8);p.fatP=+($('#nt-fat .on')?.dataset.v||.25);touchState();closeSheet();render();toast('Đã cập nhật dinh dưỡng')},
 resetadj:()=>{S.adapt.kcalAdj=0;touchState();closeSheet();render()},
 addfood:()=>{foodPick=null;foodMul=1;UI.foodQ='';foodSheet()},
 fpick:el=>{foodPick=+el.dataset.v;foodMul=1;foodSheet();$('.sheet').scrollTop=0},
 fmul:el=>{foodMul=+el.dataset.v;foodSheet()},
 fadd:()=>{const f=FOODS[foodPick];const m=foodMul;const k=today();const d=getDay(k,true);d.food=d.food||[];
  const it={n:f[0],q:(m!==1?fk(m)+' × ':'')+f[1],p:+(f[2]*m).toFixed(1),c:+(f[3]*m).toFixed(1),f:+(f[4]*m).toFixed(1)};it.k=Math.round(it.p*4+it.c*4+it.f*9);
  d.food.push(it);d.habits.protein=Math.round((d.habits.protein||0)+it.p);touchDay(k);closeSheet();render();toast(`+${it.k} kcal · ${fk(it.p)}g đạm`)},
 fcustom:()=>{const nm=$('#cf-n').value.trim()||'Món khác';const kc=parseFloat($('#cf-k').value);const pr=parseFloat(($('#cf-p').value||'0').replace(',','.'))||0;if(!(kc>0)){toast('Nhập số kcal');return}
  const k=today();const d=getDay(k,true);d.food=d.food||[];const fat=0;const carb=Math.max(0,(kc-pr*4)/4);d.food.push({n:nm,q:'tự nhập',k:Math.round(kc),p:pr,c:+carb.toFixed(1),f:fat});d.habits.protein=Math.round((d.habits.protein||0)+pr);touchDay(k);closeSheet();render()},
 delfood:el=>{const k=today();const d=S.days[k];const rm=d.food.splice(+el.dataset.v,1)[0];d.habits.protein=Math.max(0,Math.round((d.habits.protein||0)-(rm?rm.p:0)));touchDay(k);render()}
};
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-a]');if(!el)return;const f=A[el.dataset.a];if(f){if(el.dataset.a==='closesheet'&&ev.target!==el)return;f(el,ev)}});
document.addEventListener('input',ev=>{const el=ev.target;
  if(el.dataset.in==='ob'){OB[el.dataset.k]=el.value;if(el.dataset.k==='name')return;}
  if(el.dataset.in==='learnq'){UI.learnQ=el.value;clearTimeout(A._lq);A._lq=setTimeout(()=>{render();const i=$('#learn-q');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}},250)}
  if(el.dataset.in==='foodq'){UI.foodQ=el.value;clearTimeout(A._fq);A._fq=setTimeout(()=>{foodSheet();const i=$('#food-q');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}},250)}
});
document.addEventListener('change',ev=>{const el=ev.target;
  if(el.id==='restore-file'&&el.files&&el.files[0]){restoreData(el.files[0]);return}
  if(el.dataset.in==='w'||el.dataset.in==='r'){const v=parseFloat(el.value.replace(',','.'));if(!isFinite(v)||v<0){render();return}const q=wkSet(el.dataset.e,el.dataset.s);
    if(el.dataset.in==='w'){q.w=v;const e=S.days[today()].plan.ex[+el.dataset.e];e.sets.forEach((z,j)=>{if(j>+el.dataset.s&&!z.done){z.w=v;const i=$('#w-'+el.dataset.e+'-'+j);if(i)i.value=fk(v)}})}else q.r=Math.round(v);touchDay(today())}
});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&UI.view==='workout')lockScreen()});

/* ============ boot ============ */
function boot(){
  if(P()){
    const r=adaptKcal();if(r)setTimeout(()=>toast(`Calo tự chỉnh ${r.adj>0?'+':''}${r.adj} kcal theo cân nặng tuần qua`),800);
    const d=S.days[today()];if(d&&d.started&&!d.finished&&UI.view!=='workout'){/* resume prompt shown via button */}
  }
  render();
}
boot();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker'in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
