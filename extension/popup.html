<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>wikiPhidia</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header class="top">
  <span class="mark">字</span>
  <div class="top-text">
    <div class="name">wikiPhidia</div>
    <div id="status" class="status"></div>
  </div>
  <div class="pick-modes" role="radiogroup" aria-label="When I select a word">
    <button class="pick-mode" data-pick="button" role="radio" title="Selecting a word shows the 字 button (click it, or press Shift)" aria-label="Show the 字 button">字</button>
    <button class="pick-mode" data-pick="open" role="radio" title="Selecting a word opens the card at once" aria-label="Open the card at once">⚡</button>
  </div>
  <label class="power" title="Turn wikiPhidia on or off on every page"><input type="checkbox" id="enabled" role="switch" aria-label="On"><span class="sw" aria-hidden="true"></span></label>
  <button id="openApp" class="btn">Open app</button>
</header>
<div id="update" class="update" hidden><div><b>Version <span id="updateVersion"></span> is ready</b><small>Download it, unzip it over your extension folder, then press Reload.</small></div><a id="updateGet" class="btn" href="https://github.com/phillipxnguyen/wikiPhidia/archive/refs/heads/main.zip" target="_blank">Download</a><button id="updateReload" class="btn ghost-btn">Reload</button></div>
<button id="ytLesson" class="yt-lesson" hidden><span>🎬</span><b>Make a lesson from this video</b><small id="ytTitle"></small></button>
<nav class="tabs" role="tablist">
  <button data-tab="pending" class="on" role="tab">To send <b id="pendingN"></b></button>
  <button data-tab="recent" role="tab">Recent</button>
  <button data-tab="settings" role="tab">Settings</button>
</nav>
<section id="tab-pending" class="tab">
  <div id="pendingList" class="list"></div>
  <p class="hint">Select a word or phrase on any page, then press <kbd>Shift</kbd> or click the green 字 button. Words wait here until wikiPhidia is open in a tab, then go straight into Vocabulary.</p>
</section>
<section id="tab-recent" class="tab" hidden>
  <div id="recentList" class="list"></div>
</section>
<section id="tab-settings" class="tab" hidden>
  <label class="row"><span>Meaning in</span><select id="lang">
    <option value="vi">Tiếng Việt</option>
    <option value="en">English</option>
    <option value="zh-CN">中文 (简体)</option>
    <option value="zh-TW">中文 (繁體)</option>
    <option value="ja">日本語</option>
    <option value="ko">한국어</option>
    <option value="fr">Français</option>
    <option value="de">Deutsch</option>
    <option value="es">Español</option>
  </select></label>
  <label class="row"><span>Words go into</span><select id="lesson"></select></label>
  <label class="row check"><input type="checkbox" id="highlight"><span>Mark words I already have on every page</span></label>
  <label class="row check"><input type="checkbox" id="shift"><span>Shift opens the card, and Shift again translates the sentence</span></label>
  <label class="row check"><input type="checkbox" id="youtube"><span>Show 字 Make a lesson on YouTube videos</span></label>
  <label class="row col"><span>App address</span><input type="url" id="appUrl" spellcheck="false"></label>
  <div class="row"><span id="versionNow" class="muted"></span><button id="reloadExt" class="btn ghost-btn">Reload extension</button></div>
</section>
<script src="vendor/pinyin-pro.js"></script>
<script src="popup.js"></script>
</body>
</html>
